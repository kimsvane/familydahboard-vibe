[project]
name = "family-dashboard"
version = "0.1.0"
description = "A local-first family calendar and home dashboard"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "httpx>=0.27,<1.0",
  "icalendar>=5.0,<7.0",
  "python-dateutil>=2.8,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "pydantic>=2.6,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
family-dashboard = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
