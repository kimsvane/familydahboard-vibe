name: Build kiosk packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "clients/linux/**"
      - ".github/workflows/kiosk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiosk-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.arch }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: clients/linux
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/linux/package-lock.json
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Install dependencies
        run: npm ci
      - name: Verify sources
        run: npm run check && npm test
      - name: Build deb and rpm
        run: npm run dist -- --${{ matrix.arch }}
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: family-dashboard-kiosk-${{ matrix.arch }}
          path: |
            clients/linux/dist/*.deb
            clients/linux/dist/*.rpm
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: List packages
        run: ls -la packages
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Family Dashboard Kiosk ${{ github.ref_name }}
          body: |
            Dedikeret kiosk-klient til Family Dashboard.

            - `.deb` til Debian/Ubuntu
            - `.rpm` til Fedora/RHEL
            - `x86_64` til Surface Pro 4 og andre x64-pc'er
            - `arm64` til Raspberry Pi og andre 64-bit ARM-enheder

            Se `clients/linux/README.md` for installation og første opsætning.
          files: |
            packages/*.deb
            packages/*.rpm
