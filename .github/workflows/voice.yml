name: Build voice assistant packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "clients/voice/**"
      - ".github/workflows/voice.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: RPM package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify sources
        run: bash clients/voice/tests/check.sh
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Prepare rpmbuild tree
        run: |
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp clients/voice/family-dashboard-voice.spec rpmbuild/SPECS/
          cp -r clients/voice/scripts rpmbuild/SOURCES/scripts
          cp -r clients/voice/systemd rpmbuild/SOURCES/systemd
          cp -r clients/voice/etc rpmbuild/SOURCES/etc
      - name: Build RPM
        run: |
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/family-dashboard-voice.spec
      - name: Collect packages
        run: |
          mkdir -p clients/voice/dist
          cp rpmbuild/RPMS/noarch/*.rpm clients/voice/dist/
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: family-dashboard-voice
          path: clients/voice/dist/*.rpm
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: List packages
        run: ls -la packages
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Family Dashboard Voice ${{ github.ref_name }}
          body: |
            Home Assistant-stemmeassistent (Assist-satellit) til Fedora-enheder.

            - `.rpm` til Fedora/RHEL (noarch)
            - Kører Linux Voice Assistant (ESPHome-protokollen, port 6053)
            - Wake word "okay nabu" som standard

            Se `clients/voice/README.md` for installation og første opsætning.
          files: |
            packages/*.rpm